name: Build Pages site into docs/

# GitHub Pages for this repo uses "Deploy from a branch" (Settings → Pages),
# pointed at this branch with the /docs folder. This workflow rebuilds the
# static export into docs/ on every push so the published site stays current.
# (The Actions-based deploy-pages path is blocked by the github-pages
# environment's deployment-branch policy, so we deploy the branch-folder way.)

on:
  push:
    branches: [claude/modern-dynamic-site-redesign-4gxt6k]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # Site is served under the repo sub-path:
          # https://thewebstylist.github.io/Nextlevelsite2026/
          PAGES_BASE_PATH: /Nextlevelsite2026
        run: npm run build

      - name: Stage export into docs/
        run: |
          touch out/.nojekyll
          rm -rf docs
          mv out docs

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ unchanged — nothing to commit"
          else
            git commit -m "Rebuild docs/ static export [automated]"
            git push
          fi
